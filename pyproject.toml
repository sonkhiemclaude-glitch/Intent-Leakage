[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-leakage"
version = "0.1.0"
description = "Reproducible implementation scaffold for encrypted-traffic intent leakage and intent-aware shaping"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
cnn = ["torch>=2.2"]
aws = ["boto3>=1.34"]
deploy = ["paramiko==5.0.0"]
capture = ["cryptography>=44.0"]

[project.scripts]
intent-leakage = "intent_leakage.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["realtime: real OS scheduling/TLS/process-start timing qualification; run and report separately"]
pythonpath = ["src"]
filterwarnings = [
  "error::RuntimeWarning:intent_leakage.*",
]
